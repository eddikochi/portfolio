<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eddi Kochi — Portfolio</title>
<meta name="description" content="Eddi Kochi — Digital Experience · UX, CRO, CRM, Data & Governance">
<meta name="author" content="Eddi Kochi">
<meta name="theme-color" content="#0E0D0C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0E0D0C;
    --ink: #E8E9E4;
    --ink-faint: #888880;
    --accent: #CA6275;
    --accent-light: #D5798A;
    --serif: 'Fraunces', Georgia, serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  /* Aurora blobs */
  .aurora {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .13;
  }
  .blob--1 {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #CA6275 0%, transparent 70%);
    top: -120px; right: -80px;
  }
  .blob--2 {
    width: 380px; height: 380px;
    background: radial-gradient(circle, #7b6ca8 0%, transparent 70%);
    bottom: -80px; left: -60px;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 520px;
    width: 100%;
  }

  /* Brand */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: -.01em;
    margin-bottom: 3rem;
  }
  .brand img {
    border-radius: 5px;
    flex-shrink: 0;
  }

  /* Label */
  .label {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 1.25rem;
  }

  /* Heading */
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 500;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: .75rem;
    letter-spacing: -.02em;
  }

  .sub {
    font-family: var(--mono);
    font-size: .8rem;
    color: var(--ink-faint);
    letter-spacing: .04em;
    margin-bottom: 3rem;
  }

  /* Divider line */
  .divider-line {
    width: 48px;
    height: 1px;
    background: var(--accent);
    opacity: .35;
    margin: 0 auto 3rem;
  }

  /* Lang buttons */
  .lang-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .lang-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .5rem;
    padding: 1.75rem 2.5rem;
    border: 1px solid rgba(232,233,228,.12);
    border-radius: 16px;
    background: rgba(232,233,228,.04);
    color: var(--ink);
    text-decoration: none;
    font-family: var(--serif);
    transition: border-color .2s, background .2s, transform .18s;
    min-width: 160px;
    cursor: pointer;
  }
  .lang-btn:hover {
    border-color: var(--accent);
    background: rgba(202,98,117,.07);
    transform: translateY(-2px);
  }

  .lang-btn__flag {
    font-size: 2rem;
    line-height: 1;
  }
  .lang-btn__name {
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: -.01em;
  }
  .lang-btn__desc {
    font-family: var(--mono);
    font-size: .65rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .lang-btn--primary {
    border-color: rgba(202,98,117,.4);
  }

  /* Footer note */
  .note {
    margin-top: 3rem;
    font-family: var(--mono);
    font-size: .65rem;
    color: var(--ink-faint);
    letter-spacing: .04em;
  }

  @media (max-width: 400px) {
    .lang-buttons { flex-direction: column; align-items: center; }
    .lang-btn { width: 100%; max-width: 240px; }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
</div>

<div class="content">
  <a href="index.html" class="brand">
    <img src="favicon.svg" alt="" width="22" height="22">
    Eddi&nbsp;Kochi
  </a>

  <span class="label">Portfolio · Choose your language</span>
  <h1>Digital Experience</h1>
  <p class="sub">UX · CRO · CRM · Data · Governance</p>

  <div class="divider-line"></div>

  <div class="lang-buttons">
    <a href="index.html" class="lang-btn lang-btn--primary">
      <span class="lang-btn__flag">🇧🇷</span>
      <span class="lang-btn__name">Português</span>
      <span class="lang-btn__desc">Versão brasileira</span>
    </a>
    <a href="en/index.html" class="lang-btn">
      <span class="lang-btn__flag">🇺🇸</span>
      <span class="lang-btn__name">English</span>
      <span class="lang-btn__desc">English version</span>
    </a>
  </div>

  <p class="note">eddikochi.github.io/portfolio</p>
</div>

</body>
</html>
